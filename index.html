<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fa">
  <title>Crimpdeq Data Visualizer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="container">
    <header class="toolbar">
      <div class="connection">
        <span id="connection-status" class="status"><span class="status-dot"></span><span id="status-text">Not connected</span></span>
        <span id="battery-status" class="battery-status" aria-live="polite" hidden></span>
        <div class="connection-actions">
          <button id="connect" class="button button-outline" type="button">Connect device</button>
        </div>
      </div>
      <div class="session-actions">
        <button id="tare" class="button button-outline" type="button" disabled>Tare</button>
        <button id="start" class="button button-primary" type="button" disabled>Start</button>
        <button id="stop" class="button button-outline" type="button" disabled>Stop</button>
      </div>
    </header>

    <div id="notice" class="notice" role="status" hidden></div>

    <section class="metrics" aria-label="Live measurements">
      <article class="metric">
        <div class="metric-label">CURRENT MEASUREMENT</div>
        <div class="metric-value"><span id="current">—</span><span class="unit">kg</span></div>
        <div class="metric-peak"><span>MAX</span><strong id="maximum">—</strong><span class="unit">kg</span></div>
      </article>
      <article class="metric">
        <div class="metric-label">CURRENT 5-SEC MEAN</div>
        <div class="metric-value"><span id="mean">—</span><span class="unit">kg</span></div>
        <div class="metric-peak"><span>MAX</span><strong id="max-mean">—</strong><span class="unit">kg</span></div>
      </article>
    </section>

    <section class="chart-card" aria-label="Session chart">
      <div class="chart-legend" aria-hidden="true">
        <span><i class="legend-marker legend-maximum"></i>MAX</span>
        <span><i class="legend-marker legend-mean"></i>MAX 5s</span>
      </div>
      <div class="chart-wrap">
        <canvas id="chart" role="img" aria-label="Force over time. Red marker is the maximum reading; shaded range is the highest five-second mean window."></canvas>
      </div>
      <div class="chart-footer"><span id="elapsed" aria-label="Elapsed time">0:00</span></div>
    </section>
  </main>
</body>
</html>
